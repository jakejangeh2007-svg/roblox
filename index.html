<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#78a7ff" />
    <title>Voxelcraft</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='6' fill='%237cbd6b'/%3E%3Crect y='6' width='16' height='10' fill='%23795548'/%3E%3C/svg%3E"
    />
    <style>
      /* Full-bleed canvas; HUD lives in an overlay layer that composites separately. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed; /* defeats iOS Safari rubber-band scrolling */
        background: #000;
        touch-action: none; /* we own every gesture */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none; /* individual controls re-enable */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        z-index: 10;
      }
      #debug-overlay {
        position: absolute;
        top: calc(env(safe-area-inset-top) + 6px);
        left: calc(env(safe-area-inset-left) + 6px);
        color: #fff;
        font-size: 11px;
        line-height: 1.5;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        white-space: pre;
        pointer-events: none;
      }
      #boot-error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #ff8080;
        background: #1a0000;
        padding: 24px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div id="debug-overlay"></div>
    </div>
    <div id="boot-error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
